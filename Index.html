<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<meta
name="theme-color"
content="#000000">

<meta
name="apple-mobile-web-app-capable"
content="yes">

<meta
name="apple-mobile-web-app-status-bar-style"
content="black-translucent">

<meta
name="mobile-web-app-capable"
content="yes">

<title>GeoStamp Camera</title>

<link rel="manifest"
href="manifest.json">

<link
rel="icon"
href="assets/icon-192.png">

<link
rel="apple-touch-icon"
href="assets/icon-192.png">

<link
rel="stylesheet"
href="style.css">

</head>

<body>

<div id="loadingScreen">

<div class="loader"></div>

<h2>GeoStamp Camera</h2>

<p>

Loading Camera...

</p>

</div>

<div id="app">

<video

id="camera"

autoplay

playsinline

muted

></video>

<canvas

id="photoCanvas"

style="display:none">

</canvas>

<div id="cameraOverlay">

<div id="topBar">

<div class="gpsStatus">

<span
id="gpsDot">

</span>

<span
id="gpsText">

Waiting GPS...

</span>

</div>

<div
id="accuracyBox">

Accuracy :

<span
id="accuracy">

--

</span>

m

</div>

</div>

<div id="bottomOverlay">

<div id="overlayLeft">

<img

src="assets/map.jpg"

id="mapImage"

alt="Map">

</div>

<div id="overlayRight">

<div class="locationTitle">

<span id="city">

Loading...

</span>

</div>

<div class="addressText">

<span id="address">

Searching Address...

</span>

</div>

<div class="infoRow">

<div>

Latitude

</div>

<div id="latitude">

--

</div>

</div>

<div class="infoRow">

<div>

Longitude

</div>

<div id="longitude">

--

</div>

</div>
<div class="infoRow">
                        <div>Date</div>
                        <div id="currentDate">--/--/----</div>
                    </div>

                    <div class="infoRow">
                        <div>Time</div>
                        <div id="currentTime">--:--:--</div>
                    </div>

                    <div class="infoRow">
                        <div>Altitude</div>
                        <div id="altitude">-- m</div>
                    </div>

                    <div class="infoRow">
                        <div>Speed</div>
                        <div id="speed">0 km/h</div>
                    </div>

                    <div class="infoRow">
                        <div>Direction</div>
                        <div id="direction">N</div>
                    </div>

                </div>

            </div>

        </div>

        <div id="controls">

            <button
                id="switchCamera"
                class="controlBtn"
                aria-label="Switch Camera">

                <span>🔄</span>

            </button>

            <button
                id="captureButton"
                aria-label="Capture Photo">

                <img
                    src="assets/camera.png"
                    id="captureIcon"
                    alt="Capture">

            </button>

            <button
                id="galleryButton"
                class="controlBtn"
                aria-label="Gallery">

                <span>🖼️</span>

            </button>

        </div>

    </div>

    <div id="permissionDialog"
         class="hidden">

        <div class="permissionCard">

            <h2>

                Camera Permission

            </h2>

            <p>

                Camera, GPS and Storage permission
                is required to use GeoStamp Camera.

            </p>

            <button
                id="grantPermission">

                Allow Permission

            </button>

        </div>

    </div>
<div id="toast" class="hidden">

        <span id="toastMessage">

            Ready

        </span>

    </div>

    <script src="gps.js"></script>

    <script src="camera.js"></script>

    <script src="overlay.js"></script>

    <script src="app.js"></script>

    <script>

        if ("serviceWorker" in navigator) {

            window.addEventListener("load", () => {

                navigator.serviceWorker
                    .register("sw.js")
                    .then(() => {

                        console.log("Service Worker Registered");

                    })
                    .catch(err => {

                        console.error(err);

                    });

            });

        }

    </script>

</body>

</html>
