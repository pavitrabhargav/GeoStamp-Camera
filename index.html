<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<meta name="theme-color" content="#000000">

<meta name="apple-mobile-web-app-capable" content="yes">

<meta name="mobile-web-app-capable" content="yes">

<title>GeoStamp Camera Pro</title>

<link rel="manifest" href="manifest.json">

<link rel="stylesheet" href="style.css">

</head>

<body>

<!-- ========================= -->
<!-- Loading Screen -->
<!-- ========================= -->

<div id="loadingScreen">

<div class="loader"></div>

<p>Loading Camera...</p>

</div>

<!-- ========================= -->
<!-- Permission Screen -->
<!-- ========================= -->

<div id="permissionScreen" class="hidden">

<div class="permissionBox">

<h2>Camera Permission</h2>

<p>

Please allow Camera and Location
permission to continue.

</p>

<button id="grantPermission">

Grant Permission

</button>

</div>

</div>

<!-- ========================= -->
<!-- Main App -->
<!-- ========================= -->

<div id="app" class="hidden">

<!-- Camera Preview -->

<video
id="camera"
autoplay
playsinline
muted>
</video>

<!-- Hidden Canvas -->

<canvas id="photoCanvas"></canvas>

<!-- Overlay -->

<div id="overlay">

<div class="topOverlay">

<div class="logoBox">

<img
src="assets/logo.png"
id="logo">

<span>

GeoStamp Camera

</span>

</div>

<div class="batteryClock">

<div id="liveTime">

00:00:00

</div>

</div>

</div>
<!-- ========================= -->
<!-- Live Information Overlay -->
<!-- ========================= -->

<div class="bottomOverlay">

<div class="infoCard">

<div class="infoRow">
<span class="label">📍 Address</span>
<span id="address">
Fetching location...
</span>
</div>

<div class="infoRow">
<span class="label">🌍 Latitude</span>
<span id="latitude">0.000000</span>
</div>

<div class="infoRow">
<span class="label">🌎 Longitude</span>
<span id="longitude">0.000000</span>
</div>

<div class="infoRow">
<span class="label">📡 Accuracy</span>
<span id="accuracy">0 m</span>
</div>

<div class="infoRow">
<span class="label">📅 Date</span>
<span id="currentDate">
00/00/0000
</span>
</div>

<div class="infoRow">
<span class="label">🕒 Time</span>
<span id="currentTime">
00:00:00
</span>
</div>

</div>

</div>

<!-- ========================= -->
<!-- Camera Controls -->
<!-- ========================= -->

<div class="controls">

<button
id="flashBtn"
class="controlBtn"
title="Flash">

⚡

</button>

<button
id="captureBtn"
class="captureBtn">

<div class="captureInner"></div>

</button>

<button
id="switchBtn"
class="controlBtn"
title="Switch Camera">

🔄

</button>

</div>

<!-- ========================= -->
<!-- Status Message -->
<!-- ========================= -->

<div id="statusMessage">

Initializing...

</div>
<!-- ========================= -->
<!-- Photo Preview -->
<!-- ========================= -->

<div id="photoPreview" class="hidden">

    <img id="capturedImage" alt="Captured Photo">

    <div class="previewButtons">

        <button id="downloadBtn">
            💾 Save
        </button>

        <button id="retakeBtn">
            📷 Retake
        </button>

    </div>

</div>

</div>
<!-- End App -->

<!-- ========================= -->
<!-- Hidden Audio -->
<!-- ========================= -->

<audio id="shutterSound" preload="auto">
    <source src="assets/shutter.mp3" type="audio/mpeg">
</audio>

<!-- ========================= -->
<!-- Scripts -->
<!-- ========================= -->

<script src="gps.js"></script>
<script src="camera.js"></script>
<script src="overlay.js"></script>
<script src="app.js"></script>

<script>

if ("serviceWorker" in navigator) {

window.addEventListener("load", () => {

navigator.serviceWorker.register("service-worker.js")
.then(() => {

console.log("Service Worker Registered");

})
.catch(err => {

console.log(err);

});

});

}

</script>

</body>

</html>
