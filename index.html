<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GeoStamp Camera</title>


<link rel="stylesheet" href="style.css">


<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>


</head>


<body>


<div id="cameraContainer">


<!-- Camera -->

<video id="camera"
autoplay
playsinline>
</video>



<!-- Live GPS Overlay -->

<div id="stampOverlay">


<div id="mapPreview">

🗺️

</div>



<div id="stampText">


<h2 id="placeName">
Loading Location...
</h2>


<p id="country">
India 🇮🇳
</p>


<p id="address">
Searching Address...
</p>


<p id="lat">
Lat --
</p>


<p id="lng">
Long --
</p>


<p id="dateTime">
Loading Time...
</p>


</div>


</div>





<!-- Capture Button -->

<button id="captureBtn">

📸

</button>



</div>





<!-- Hidden Canvas -->

<canvas id="canvas"></canvas>



<!-- Final Photo -->

<img id="result">





<!-- Map Data -->

<div id="map"></div>





<script src="script.js"></script>


</body>


</html>
